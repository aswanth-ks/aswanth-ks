<!--
  TECHNOLOGY STACK — animated card.
  Each row slides + fades in, staggered (SMIL). Category label in gradient,
  technologies in primary text. Self-contained dark card.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="316" viewBox="0 0 820 316" fill="none" role="img" aria-label="Stack — Backend: Java, Spring Boot, Python, FastAPI, Node.js. Frontend: React, TypeScript, Tailwind CSS. Database: PostgreSQL, MySQL, MongoDB. AI: OpenAI APIs, LangChain, LLM integration. IoT: ESP32, Arduino, Embedded Systems. Tools: Git, Docker, Linux.">
  <defs>
    <linearGradient id="cat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="818" height="314" rx="16" fill="#11151C" stroke="#1E2430" stroke-width="1"/>

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="22 0" to="0 0" begin="0.15s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
      <circle cx="56" cy="48" r="3" fill="url(#cat)"/>
      <text x="200" y="53" text-anchor="end" font-size="14.5" font-weight="700" fill="url(#cat)">Backend</text>
      <text x="224" y="53" font-size="14.5" fill="#E6E8EB">Java · Spring Boot · Python · FastAPI · Node.js</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.30s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="22 0" to="0 0" begin="0.30s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
      <circle cx="56" cy="92" r="3" fill="url(#cat)"/>
      <text x="200" y="97" text-anchor="end" font-size="14.5" font-weight="700" fill="url(#cat)">Frontend</text>
      <text x="224" y="97" font-size="14.5" fill="#E6E8EB">React · TypeScript · Tailwind CSS</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="22 0" to="0 0" begin="0.45s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
      <circle cx="56" cy="136" r="3" fill="url(#cat)"/>
      <text x="200" y="141" text-anchor="end" font-size="14.5" font-weight="700" fill="url(#cat)">Database</text>
      <text x="224" y="141" font-size="14.5" fill="#E6E8EB">PostgreSQL · MySQL · MongoDB</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.60s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="22 0" to="0 0" begin="0.60s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
      <circle cx="56" cy="180" r="3" fill="url(#cat)"/>
      <text x="200" y="185" text-anchor="end" font-size="14.5" font-weight="700" fill="url(#cat)">AI</text>
      <text x="224" y="185" font-size="14.5" fill="#E6E8EB">OpenAI APIs · LangChain · LLM integration</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="22 0" to="0 0" begin="0.75s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
      <circle cx="56" cy="224" r="3" fill="url(#cat)"/>
      <text x="200" y="229" text-anchor="end" font-size="14.5" font-weight="700" fill="url(#cat)">IoT</text>
      <text x="224" y="229" font-size="14.5" fill="#E6E8EB">ESP32 · Arduino · Embedded Systems</text>
    </g>

    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.90s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="22 0" to="0 0" begin="0.90s" dur="0.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.2 1"/>
      <circle cx="56" cy="268" r="3" fill="url(#cat)"/>
      <text x="200" y="273" text-anchor="end" font-size="14.5" font-weight="700" fill="url(#cat)">Tools</text>
      <text x="224" y="273" font-size="14.5" fill="#E6E8EB">Git · Docker · Linux</text>
    </g>

  </g>
</svg>
